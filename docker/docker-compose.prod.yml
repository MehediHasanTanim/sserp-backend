services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: sserp-api:pinned
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgresql://sserp_app:sserp_app@postgres:5432/sserp
    depends_on:
      - postgres
      - redis
      - minio
    expose:
      - '3000'
    restart: unless-stopped

  worker:
    image: sserp-api:pinned
    user: '1000:1000'
    command: ['node', 'dist/worker.main.js']
    env_file: ../.env.production
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  pdf-worker:
    image: sserp-api:pinned
    user: '1000:1000'
    command: ['node', 'dist/worker.main.js']
    environment:
      WORKER_QUEUES: pdf
    env_file: ../.env.production
    depends_on:
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sserp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sserp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-app-role.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    command:
      - postgres
      - -c
      - log_min_duration_statement=500
    # no published ports — internal only
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command: ['redis-server', '--save', '900', '1']
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-01T00-00-00Z
    command: server /data
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1.0
    environment:
      DATABASE_URL: postgresql://sserp_app:sserp_app@postgres:5432/sserp
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
