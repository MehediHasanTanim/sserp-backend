services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sserp
      POSTGRES_PASSWORD: sserp
      POSTGRES_DB: sserp
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-app-role.sql:/docker-entrypoint-initdb.d/01-init-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sserp -d sserp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional local object storage. Not started by default — app uses Cloudflare R2
  # from .env. To use MinIO instead: docker compose --profile minio up -d
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    profiles: ["minio"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1026:1025"
      - "8026:8025"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8030:3000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://sserp:sserp@postgres:5432/sserp?schema=public
      DATABASE_APP_URL: postgresql://sserp_app:sserp_app@postgres:5432/sserp?schema=public
      REDIS_URL: redis://redis:6379
      # Object storage comes from ../.env (Cloudflare R2). Do not override to local MinIO.
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      COOKIE_SECURE: "false"
    volumes:
      - ../keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/docker/api-entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/api/v1/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres_data:
  minio_data:
