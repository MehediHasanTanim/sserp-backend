services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sserp
      POSTGRES_PASSWORD: sserp
      POSTGRES_DB: sserp
    ports:
      - "55433:5432"
    volumes:
      - ./postgres/init-app-role.sql:/docker-entrypoint-initdb.d/01-init-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sserp -d sserp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8031:3000"
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://sserp:sserp@postgres:5432/sserp?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMeNow1
      BOOTSTRAP_ADMIN_EMAIL: admin@sserp.local
      BOOTSTRAP_ADMIN_USERNAME: superadmin
      CORS_ORIGINS: http://localhost:3001
      LOG_LEVEL: error
    volumes:
      - ../keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/app/docker/api-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
