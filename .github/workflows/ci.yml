name: CI

on:
  push:
  pull_request:

jobs:
  stage1-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm audit --audit-level=high || true

  stage2-unit:
    runs-on: ubuntu-latest
    needs: stage1-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit -- --coverage

  stage3-integration:
    runs-on: ubuntu-latest
    needs: stage2-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sserp
          POSTGRES_PASSWORD: sserp
          POSTGRES_DB: sserp
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: --health-cmd "curl -f http://localhost:9000/minio/health/live" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sserp:sserp@localhost:5432/sserp?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY_PATH: ./keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: ./keys/jwt-public.pem
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: 'false'
      COOKIE_SECURE: 'false'
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMeNow1
      BOOTSTRAP_ADMIN_EMAIL: admin@sserp.local
      BOOTSTRAP_ADMIN_USERNAME: superadmin
      CORS_ORIGINS: http://localhost:3001
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: |
          openssl genrsa -out keys/jwt-private.pem 2048
          openssl rsa -in keys/jwt-private.pem -pubout -out keys/jwt-public.pem
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run test:integration

  stage4-openapi:
    runs-on: ubuntu-latest
    needs: stage2-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: |
          openssl genrsa -out keys/jwt-private.pem 2048
          openssl rsa -in keys/jwt-private.pem -pubout -out keys/jwt-public.pem
      - name: Export OpenAPI (requires running deps skipped — generate from module metadata)
        run: echo "OpenAPI check runs locally via npm run openapi:export"
