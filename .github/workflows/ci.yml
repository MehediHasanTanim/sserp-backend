name: CI

on:
  push:
  pull_request:

jobs:
  stage1-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:no-retry
      - run: npm run check:sensitive-fixtures
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm audit --audit-level=high

  stage2-unit:
    runs-on: ubuntu-latest
    needs: stage1-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:cov
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: |
            coverage/unit
            reports/jest
          retention-days: 30
      - name: Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/unit/lcov.info
          fail_ci_if_error: false

  stage3-integration:
    runs-on: ubuntu-latest
    needs: stage2-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sserp
          POSTGRES_PASSWORD: sserp
          POSTGRES_DB: sserp
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: --health-cmd "curl -f http://localhost:9000/minio/health/live" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sserp:sserp@localhost:5432/sserp?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY_PATH: ./keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: ./keys/jwt-public.pem
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: 'false'
      COOKIE_SECURE: 'false'
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMeNow1
      BOOTSTRAP_ADMIN_EMAIL: admin@sserp.local
      BOOTSTRAP_ADMIN_USERNAME: superadmin
      CORS_ORIGINS: http://localhost:3001
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: |
          openssl genrsa -out keys/jwt-private.pem 2048
          openssl rsa -in keys/jwt-private.pem -pubout -out keys/jwt-public.pem
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run test:integration
      - name: OpenAPI route coverage
        run: |
          npm run openapi:export || true
          npm run test:openapi-routes
      - name: Upload route coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-coverage
          path: reports/route-coverage
          retention-days: 30

  stage4-openapi-semgrep:
    runs-on: ubuntu-latest
    needs: stage2-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: |
          openssl genrsa -out keys/jwt-private.pem 2048
          openssl rsa -in keys/jwt-private.pem -pubout -out keys/jwt-public.pem
      - name: OpenAPI export + check
        run: |
          npm run openapi:export
          npm run openapi:check
      - name: Semgrep architectural rules
        run: npm run semgrep
      - name: Traceability coverage
        run: npm run test:traceability
      - name: Report coverage parity
        run: npm run test:report-coverage
      - name: Snyk
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then echo "SNYK_TOKEN not set — skip"; exit 0; fi
          npm install -g snyk
          snyk test --severity-threshold=high

  stage5-security-images:
    runs-on: ubuntu-latest
    needs: stage2-unit
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sserp-api:ci .
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sserp-api:ci
          severity: HIGH,CRITICAL
          exit-code: '1'

  stage6-zap:
    runs-on: ubuntu-latest
    needs: stage3-integration
    steps:
      - uses: actions/checkout@v4
      - name: Start test stack
        run: |
          openssl genrsa -out keys/jwt-private.pem 2048
          openssl rsa -in keys/jwt-private.pem -pubout -out keys/jwt-public.pem
          docker compose -f docker/docker-compose.test.yml up -d --wait || docker compose -f docker/docker-compose.test.yml up -d
          sleep 40
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8031'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          cmd_options: '-a'
        continue-on-error: true
      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          retention-days: 90
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v || true
