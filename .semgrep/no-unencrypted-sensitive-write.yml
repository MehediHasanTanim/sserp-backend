rules:
  - id: no-unencrypted-sensitive-write
    patterns:
      - pattern: |
          $PRISMA.student.create({
            data: {
              ...,
              disabilityCategory: $VAL,
              ...
            }
          })
      - pattern-not: |
          $PRISMA.student.create({
            data: {
              ...,
              disabilityCategoryHash: $HASH,
              ...
            }
          })
    message: >
      Writes to encrypted/sensitive columns must go through the field-encryption extension
      (disabilityCategory should set disabilityCategoryHash via blind index).
    languages: [typescript]
    severity: WARNING
    paths:
      include:
        - src/modules/**
      exclude:
        - src/**/*.spec.ts
        - src/modules/hardening/**
