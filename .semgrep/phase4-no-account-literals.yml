rules:
  - id: no-account-code-literals-outside-accounts
    languages: [typescript]
    message: >-
      Account codes must be resolved via posting_rules / AccountsService.
      Do not hardcode debit/credit account codes outside the accounts module.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: 'debitAccountCode: "..."'
          - pattern: 'creditAccountCode: "..."'
    paths:
      exclude:
        - src/modules/accounts/**
        - '**/*.spec.ts'
        - prisma/**
        - dist/**
